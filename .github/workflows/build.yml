name: Build

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  SHA: ${{ GITHUB.SHA }}
  REF: ${{ GITHUB.REF }}
  RUN_ID: ${{ GITHUB.RUN_ID }}
  RUN_NUMBER: ${{ GITHUB.RUN_NUMBER }}
  BUILD_RUN_NUMBER: build.${{ GITHUB.RUN_NUMBER }}
  GITHUB_TOKEN: ${{ SECRETS.GITHUB_TOKEN }}
  COVERALLS_REPO_TOKEN: ${{ SECRETS.COVERALLS_REPO_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
          dotnet-version: |
              3.1.x
              5.0.x
              6.0.x
              7.0.x

    - name: Check .NET info
      run: dotnet --info

    - name: Install dependencies
      run: dotnet restore

    - name: Build solution
      run: dotnet build -c Release --no-restore

    - name: Start local Casdoor
      run: |
        docker run -d --name casdoor \
          -p 8000:8000 \
          -e driverName=sqlite \
          -e dataSourceName='file:casdoor.db?cache=shared' \
          -e initDataFile=/init_data.json \
          -v "$PWD/.ci/casdoor/init_data.json:/init_data.json:ro" \
          casbin/casdoor-all-in-one

        for i in {1..60}; do
          if curl -fsS http://localhost:8000 >/dev/null; then
            exit 0
          fi
          sleep 2
        done

        docker logs casdoor
        exit 1

    - name: Test solution
      run: dotnet test -c Release --no-build --no-restore --results-directory test-results --verbosity normal --collect:"XPlat Code Coverage"
           -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=json,cobertura,lcov,teamcity,opencover

    - name: Dump Casdoor logs
      if: failure()
      run: docker logs casdoor

    - name: Upload test results artefacts
      if: github.repository_owner == 'casdoor-net' && github.event_name == 'push'
      uses: actions/upload-artifact@v4
      with:
        name: "drop-ci-test-results"
        path: './test-results'

  dry-run-semantic-release:
    runs-on: ubuntu-latest
    needs: build
    if: github.repository_owner == 'casdoor-net' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dry run semantic-release
        run: |
          export PATH=$PATH:$(yarn global bin)
          yarn global add semantic-release@19.0.2
          semantic-release --dry-run

  release-build-version:
    runs-on: windows-latest
    needs: build
    if: github.repository_owner == 'casdoor-net' && github.event_name == 'push'

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Git fetch tags
      run: git fetch --tags

    - name: Check tags
      run: git tag -l -n

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
          dotnet-version: |
              3.1.x
              5.0.x
              6.0.x
              7.0.x

    - name: Check .NET info
      run: dotnet --info

    - name: Install dependencies
      run: dotnet restore

    - name: Build solution
      run: dotnet build -c Release --no-restore

    - name: Pack packages
      run: |
        $LastTag = git describe --tags (git rev-list --tags --max-count=1);
        if (!$LastTag) {
          $LastTag = "v1.0.0";
        }
        echo "Last tag is: $LastTag";
        $Version = ($LastTag).TrimStart('v');
        echo "Publishing version: $Version";
        $NowBranchName = git rev-parse --abbrev-ref HEAD;
        echo "Now branch name: $NowBranchName";
        $PackageVersion = ($LastTag).TrimStart('v') + "-" + $env:BUILD_RUN_NUMBER + "." + $NowBranchName + "." + $env:SHA.SubString(0, 7);
        $PackageVersion = $PackageVersion.Replace("#", ".");
        echo "Publishing package version: ${PackageVersion}";
        dotnet pack -c Release -o packages /p:PackageVersion=$PackageVersion /p:Version=$Version;

    - name: Upload packages artefacts
      uses: actions/upload-artifact@v4
      with:
        name: "drop-ci-build-packages"
        path: './packages'
